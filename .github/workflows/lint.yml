name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # eslint-plugin-tailwindcss needs the generated intellisense stylesheet.
      - run: npm run development:tailwind:intellisense

      - run: npm run lint

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer php:lint:errors
